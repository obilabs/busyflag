name: Build Busyflag

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
            # One .app/.dmg that runs on Apple Silicon and Intel Macs.
            args: --target universal-apple-darwin
          - os: windows-latest
            name: windows-x86_64
            args: ""
          - os: ubuntu-22.04
            name: linux-x86_64
            args: ""
          - os: ubuntu-22.04-arm
            name: linux-arm64
            # AppImage tooling is unreliable on arm64; the Pi uses .deb anyway.
            args: --bundles deb rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: busyflag/src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Signing/notarisation only when the secrets exist. An empty APPLE_CERTIFICATE
      # variable would otherwise make the bundler try to import a blank certificate.
      - name: Configure macOS signing
        # `secrets` can't be used in `if:` directly, so it goes through an env var.
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
        shell: bash
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      - name: Build
        working-directory: busyflag
        shell: bash
        run: cargo tauri build ${{ matrix.args }}

      # A flat .pkg for MDM deployment (Jamf, Intune, Kandji): `installer -pkg Busyflag.pkg -target /`.
      # Signed with the installer identity when APPLE_INSTALLER_IDENTITY is set (e.g. "Developer ID Installer: Obilabs (TEAMID)").
      - name: Build macOS .pkg
        if: runner.os == 'macOS'
        shell: bash
        env:
          INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: |
          APP=$(find busyflag/src-tauri/target -path '*/bundle/macos/Busyflag.app' -maxdepth 6 | head -1)
          VERSION=$(python3 -c "import json;print(json.load(open('busyflag/src-tauri/tauri.conf.json'))['version'])")
          mkdir -p pkgroot/Applications && cp -R "$APP" pkgroot/Applications/
          SIGN=(); [ -n "$INSTALLER_IDENTITY" ] && SIGN=(--sign "$INSTALLER_IDENTITY")
          pkgbuild --root pkgroot --install-location / --identifier com.busyflag.desktop.pkg \
            --version "$VERSION" "${SIGN[@]}" "Busyflag_${VERSION}_universal.pkg"
          mkdir -p dist && mv Busyflag_*.pkg dist/

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          find busyflag/src-tauri/target -path '*/bundle/*' \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: busyflag-${{ matrix.name }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Created as a draft so the notes can be reviewed; publishing makes it
      # immutable when the repository's "Immutable releases" setting is on.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
